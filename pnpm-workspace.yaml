packages:
  - "."
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin@1.3.5'
  - miniflare@5.20261001.0-alpha
  - wrangler@4.146.0

overrides:
  'gray-matter>js-yaml': 3.15.2
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  '@esbuild-kit/esm-loader>esbuild': 0.25.12
  '@eslint/eslintrc>js-yaml': 4.3.2
  'minimatch@3.1.5>brace-expansion': 1.1.21
  'minimatch@10.2.6>brace-expansion': 5.0.12
